<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Juego · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+Gujarati:wght@400;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-juego.css">
<link rel="stylesheet" href="tema-juego_desktop.css" media="(min-width: 1024px)">
<link rel="stylesheet" href="guia_navegacion_common.css">
</head>
<body>

<nav class="nav-bar">
  <a class="nav-btn" href="#" onclick="history.back(); return false;">← Anterior</a>
  <a class="nav-btn home" id="nav-home" href="#">🏠</a>
  <a class="nav-btn" id="nav-mapa" href="#" title="Mapa del Curso">🧭</a>
  <a class="nav-btn" id="nav-practica" href="#">Practicar →</a>
</nav>

<!-- FASE B -->
<div class="screen active" id="screen-b">
  <div class="wrap">
    <span class="badge">A reconocer</span>
    <h2>Práctica de Lectura</h2>
    <p class="subtitle">Lee la letra o frase. Tienes 3 segundos</p>
    <div class="prog-ans-row">
      <div class="game-progress" id="b-progress">1 de 16</div>
      <div class="game-answer flex-1" id="b-answer"></div>
    </div>
    <div class="game-card game-card-click" id="b-card" onclick="bNext()">&#2724;</div>
    <div class="timer-wrap"><div class="timer-bar" id="b-timer"></div></div>
    <div class="nav-row-320c">
      <button class="btn-nav-prev btn-disabled" id="btn-b-prev" onclick="bPrev()">← Anterior</button>
      <button class="btn-nav-next" id="btn-b-next" onclick="bNext()">Siguiente →</button>
    </div>
    <button class="btn-sec btn-sec-320" onclick="goTo('screen-c')">¡Hagamos el PAREO!!!</button>
  </div>
</div>

<!-- FASE C -->
<div class="screen" id="screen-c">
  <div class="wrap">
    <div class="badge-score-row">
      <span class="badge">A jugar</span>
      <div class="match-score">Correctas: <span id="c-score">0</span> / <span id="c-total">20</span></div>
    </div>
    <h2>Toca la letra que escuchas</h2>
    <div class="match-letters">
      <button class="match-btn" id="mb-0" onclick="matchTap(0)"></button>
      <button class="match-btn" id="mb-1" onclick="matchTap(1)"></button>
      <button class="match-btn" id="mb-2" onclick="matchTap(2)"></button>
      <button class="match-btn" id="mb-3" onclick="matchTap(3)"></button>
    </div>
    <p class="match-prompt" id="c-prompt">&nbsp;</p>
    <div class="btn-row">
      <button class="btn-main flex-1" id="btn-c-replay" onclick="matchReplay()">▶ Repetir</button>
      <button class="btn-main flex-1 btn-volver-c" onclick="goTo('screen-b')">← Volver</button>
    </div>
    <button class="btn-sec" onclick="goTo('screen-fin')">Saltar al Final del Juego →</button>
  </div>
</div>

<!-- FIN -->
<div class="screen" id="screen-fin">
  <div class="wrap">
    <div class="trophy-icon">🏆</div>
    <h2>¡Juego completado!</h2>
    <p class="subtitle">Ya practicaste las 6 letras. ¡Sigue así!</p>
    <a class="btn-main" id="btn-finalizar" href="#">🏆 Notas del Idioma →</a>
    <button class="btn-sec" onclick="reiniciar()">🔄 Repetir juego</button>
  </div>
</div>

<audio id="player"></audio>
<audio id="sfx"></audio>

<script src="juego.js"></script>

</body>
</html>
