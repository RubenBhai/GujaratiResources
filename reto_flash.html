<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Reto Flash · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+Gujarati:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-reto-flash.css">
<link rel="stylesheet" href="tema-reto-flash_desktop.css" media="(min-width: 1024px)">
<link rel="stylesheet" href="guia_navegacion_common.css">
</head>
<body>

<nav class="nav-bar">
  <a class="nav-btn" href="#" onclick="history.back(); return false;">← Salir</a>
  <a class="nav-btn home" id="nav-home" href="index.html">🏠</a>
  <a class="nav-btn" id="nav-mapa" href="#" title="Mapa del Curso">🧭</a>
  <span class="nav-btn nav-phantom">&nbsp;</span>
</nav>
<div class="top-progress"><div class="top-progress-fill" id="top-fill"></div></div>

<div class="wrap">

  <!-- INTRO -->
  <div class="screen active" id="s-intro">
    <span class="badge">Reto Relámpago</span>
    <h1>Practica lo que aprendiste</h1>
    <p class="lead" id="intro-desc"></p>
    <button class="btn-main" id="btn-empezar" onclick="iniciarFaseB()">▶ Empezar</button>
  </div>

  <!-- FASE B -->
  <div class="screen" id="screen-b">
    <span class="badge">A reconocer</span>
    <h2>Práctica de Lectura</h2>
    <p class="lead">Lee la letra o frase. Tienes 2 segundos</p>
    <div class="prog-ans-row">
      <div class="game-progress" id="b-progress">1 de 10</div>
      <div class="game-answer b-answer-flex" id="b-answer"></div>
    </div>
    <div class="game-card" id="b-card" onclick="bNext()">&#2724;</div>
    <div class="timer-wrap"><div class="timer-bar" id="b-timer"></div></div>
    <div class="nav-row-320c">
      <button class="btn-nav-prev btn-disabled" id="btn-b-prev" onclick="bPrev()">← Anterior</button>
      <button class="btn-nav-next" id="btn-b-next" onclick="bNext()">Siguiente →</button>
    </div>
    <button class="btn-sec btn-sec-320c" id="btn-saltar-b" onclick="terminarFaseB()"></button>
  </div>

  <!-- FASE C -->
  <div class="screen" id="screen-c">
    <span class="badge">A jugar</span>
    <h2>Toca la letra que escuchas</h2>
    <div class="badge-score-row">
      <div class="match-score">Correctas: <span id="c-score">0</span> / <span id="c-total">10</span></div>
    </div>
    <div class="match-letters" id="match-letters-container"></div>
    <p class="match-prompt" id="c-prompt">&nbsp;</p>
    <div class="btn-row">
      <button class="btn-main btn-flex" id="btn-c-replay" onclick="matchReplay()">▶ Repetir</button>
      <button class="btn-main btn-flex btn-volver-c" onclick="goTo('screen-b')">← Volver</button>
    </div>
  </div>

  <!-- FASE REPASO -->
  <div class="screen" id="screen-repaso">
    <span class="badge">Repaso final</span>
    <h2>Lee en voz alta</h2>
    <p class="lead">Pronuncia la letra que se ilumina. Luego escucharás la respuesta.</p>
    <div class="repaso-grid" id="repaso-grid"></div>
    <div class="btn-row">
      <button class="btn-main btn-flex btn-reiniciar" onclick="reiniciarRepaso()">🔄 Reiniciar</button>
      <button class="btn-main btn-flex btn-detener" id="btn-detener-repaso" onclick="detenerRepaso()">■ Terminar</button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div class="screen" id="s-resultado">
    <div class="resultado-card">
      <div class="resultado-emoji" id="res-emoji"></div>
      <div class="resultado-msg"   id="res-msg"></div>
      <div class="resultado-pct"   id="res-pct"></div>
    </div>
    <button class="btn-main" onclick="reiniciarTodo()">🔄 Repetir</button>
    <button class="btn-main" id="btn-continuar" onclick="history.back()">✓ Continuar lección</button>
  </div>

</div>

<audio id="player"></audio>
<audio id="sfx"></audio>

<script src="reto_flash.js"></script>

</body>
</html>
