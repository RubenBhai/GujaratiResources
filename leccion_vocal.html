<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title id="page-title">Vocal · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Serif+Gujarati:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-leccion_vocal.css">
<link rel="stylesheet" href="tema-leccion_vocal_desktop.css" media="(min-width: 1024px)">
<link rel="stylesheet" href="guia_navegacion_common.css">
</head>
<body>

<nav class="nav-bar">
  <a class="nav-btn" id="nav-anterior" href="#">&larr; Anterior</a>
  <a class="nav-btn home" id="nav-home" href="#">&#127968;</a>
  <a class="nav-btn" id="nav-mapa" href="#" title="Mapa del Curso">🧭</a>
  <a class="nav-btn" id="nav-palabras" href="#">Ir a palabras</a>
</nav>

<div class="wrap">
  <span class="badge" id="badge"></span>

  <div class="frame-cuadrantes" id="frame-vocal" style="display:none;">
    <div class="cuadrante-letra" id="q1-vocal"></div>
    <div class="cuadrante-detalle" id="q2-vocal"></div>
  </div>

  <!-- tipo: vocal / con_matra -->
  <div class="frame-img" id="frame-320" style="display:none;">
    <img id="img-320" alt="">
  </div>

  <!-- tipo: matra -->
  <div class="frame-img" id="frame-380" style="display:none;">
    <img id="img-380" alt="">
  </div>

  <!-- tipo: plana -->

  <div class="frame-ecuaciones" id="frame-conmatra" style="display:none;">
    <div class="eq-celda" id="eq-0"></div>
    <div class="eq-celda" id="eq-1"></div>
    <div class="eq-celda" id="eq-2"></div>
  </div>

  <div id="bloque-plana" style="display:none;">
    <div class="info-box">
      Haz esta plana <strong>varias veces</strong>.<br>
      Al terminar de dibujarla,<br>
      pronuncia en voz alta:
      <span id="roman-label"></span>
    </div>
    <div class="frame-img frame-img-340">
      <img id="img-plana" alt="">
      <canvas id="canvas-plana"></canvas>
    </div>
    <div class="btn-toolbar">
      <button id="btn-reintentar" type="button">🔄 Reintentar</button>
      <button id="btn-ver"        type="button" style="display:none;">👁️ Ver</button>
      <button id="btn-evaluar"    type="button" style="display:none;">✓ Evaluar</button>
    </div>
    <div id="resultado-evaluacion" style="display:none;"></div>
  </div>
</div>

<!-- tipo: vocal -->
<div class="bottom-actions" id="bottom-vocal" style="display:none;">
  <button class="btn-sec btn-sec-btn" id="btn-escuchar-vocal">&#128266; Escuchar</button>
  <div class="btn-row">
    <a class="btn-sec btn-flex" id="btn-sigleccion-vocal" href="#">&#9197; Sig. lección</a>
    <a class="btn-fin btn-flex btn-mt0" id="btn-siguiente-vocal" href="#">Siguiente &rarr;</a>
  </div>
</div>

<!-- tipo: matra -->
<div class="bottom-actions" id="bottom-matra" style="display:none;">
  <a class="btn-fin btn-fin-sindoor btn-mt0" id="btn-nota-especial" href="#" style="display:none;">&#128161; &iexcl;Nota especial!</a>
  <div class="btn-row">
    <a class="btn-sec btn-flex" id="btn-sigleccion-matra" href="#">&#9197; Sig. lección</a>
    <a class="btn-fin btn-flex btn-mt0" id="btn-siguiente-matra" href="#">Siguiente &rarr;</a>
  </div>
</div>

<!-- tipo: con_matra -->
<div class="bottom-actions" id="bottom-conmatra" style="display:none;">
  <button class="btn-sec btn-sec-btn btn-mt0" id="btn-secuencia"></button>
  <a class="btn-fin btn-fin-sindoor btn-mt0" id="btn-practicar-cm" href="#">&#127908; A practicar la lectura</a>
  <div class="btn-row">
    <a class="btn-sec btn-flex" id="btn-sigleccion-cm" href="#">&#9197; Sig. lección</a>
    <a class="btn-fin btn-flex btn-mt0" id="btn-siguiente-cm" href="#">Siguiente &rarr;</a>
  </div>
</div>

<!-- tipo: plana -->
<div class="bottom-actions" id="bottom-plana" style="display:none;">
  <div class="btn-row">
    <button class="btn-sec btn-sec-btn btn-flex-plana" id="btn-escuchar-plana"></button>
    <a class="btn-fin btn-flex-plana" id="btn-continuar-plana" href="#">Continuar</a>
  </div>
</div>

<audio id="player"></audio>

<script src="efecto_victoria.js"></script>
<script src="evaluacion_trazos.js"></script>
<script src="leccion_vocal.js"></script>

</body>
</html>
