<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Piensa · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+Gujarati:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-piensa.css">
</head>
<body>

<nav class="nav-bar">
  <a class="nav-btn" href="#" onclick="history.back(); return false;">← Salir</a>
  <a class="nav-btn home" href="index.html">🏠</a>
  <a class="nav-btn" id="nav-mapa" href="#" title="Mapa del Curso">🧭</a>
  <span class="nav-btn nav-phantom">&nbsp;</span>
</nav>
<div class="top-progress"><div class="top-progress-fill" id="top-fill"></div></div>

<div class="wrap">

  <!-- INICIO -->
  <div class="screen active" id="s-inicio">
    <span class="badge">Piensa en gujarati</span>
    <h1 id="inicio-titulo">¡A pensar!</h1>
    <p class="subtitle" id="inicio-intro">Escucha, lee o mira, y responde. Entiende lo que pasa y elige la respuesta correcta.</p>
    <div class="score-pill">Actividades: <span id="stat-total">0</span></div>
    <button class="btn-main" id="btn-empezar" onclick="empezar()">Empezar →</button>
  </div>

  <!-- ACTIVIDAD -->
  <div class="screen" id="s-actividad">
    <div class="estimulo-zona" id="estimulo-zona"></div>
    <div class="pregunta-zona" id="pregunta-zona">
      <div class="pregunta-enunciado" id="preg-enunciado"></div>
      <div class="pregunta-widget"    id="preg-widget" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:18px;"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <!-- FIN -->
  <div class="screen" id="s-fin">
    <div class="trophy">🏆</div>
    <h2>¡Terminaste de pensar!</h2>
    <div class="resumen-box">
      <div class="resumen-row"><span>Preguntas respondidas</span><span class="val" id="fin-total">0</span></div>
      <div class="resumen-row"><span>Aciertos a la primera</span><span class="val" id="fin-aciertos">0</span></div>
    </div>
    <button class="btn-main" onclick="location.reload()">Practicar de nuevo →</button>
    <a class="btn-sec" href="#" onclick="history.back(); return false;">Volver al menú</a>
  </div>

</div>

<audio id="player"></audio>
<audio id="sfx"></audio>

<script src="piensa.js"></script>

</body>
</html>
