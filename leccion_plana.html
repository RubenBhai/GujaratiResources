<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title id="page-title">Plana · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Serif+Gujarati:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-leccion_plana.css">
<link rel="stylesheet" href="tema-leccion_plana_desktop.css" media="(min-width: 1024px)">
<link rel="stylesheet" href="guia_navegacion_common.css">
</head>
<body>

<nav class="nav-bar">
  <a class="nav-btn" id="nav-anterior" href="#">&larr; Anterior</a>
  <a class="nav-btn home" id="nav-home" href="#">&#127968;</a>
  <a class="nav-btn" id="nav-mapa" href="#" title="Mapa del Curso">🧭</a>
  <a class="nav-btn" id="nav-palabras" href="#">Ir a palabras</a>
</nav>

<div class="wrap">

  <div class="info-box">
    Haz esta plana <strong>varias veces</strong>.<br>
    Al terminar de dibujarla,<br>
    pronuncia en voz alta:
    <span id="roman-label"></span>
  </div>

  <div class="frame-img">
    <img id="img-plana" alt="" onerror="this.style.opacity='0.3'">
    <canvas id="canvas-plana"></canvas>
  </div>

  <div class="btn-toolbar">
    <button id="btn-reintentar" type="button">🔄 Reintentar</button>
    <button id="btn-ver"        type="button" style="display:none;">👁️ Ver</button>
    <button id="btn-evaluar"    type="button" style="display:none;">✓ Evaluar</button>
  </div>
  <div id="resultado-evaluacion" style="display:none;"></div>

</div>

<div class="bottom-actions">
  <div class="btn-row">
    <button class="btn-sec btn-flex-plana" id="btn-escuchar">🎵 Escucha</button>
    <a class="btn-fin btn-fin-plana" id="btn-continuar" href="#">Continuar</a>
  </div>
</div>

<audio id="player"></audio>

<script src="efecto_victoria.js"></script>
<script src="evaluacion_trazos.js"></script>
<script src="leccion_plana.js"></script>

</body>
</html>
