<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Lección Completada · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+Gujarati:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-leccion_palabra.css">
<link rel="stylesheet" href="tema-leccion_palabra_fin.css">
<link rel="stylesheet" href="tema-leccion_palabra_fin_desktop.css" media="(min-width: 1024px)">
<link rel="stylesheet" href="guia_navegacion_common.css">
</head>
<body>

<nav class="nav-bar">
  <a class="nav-btn" id="nav-vocab" href="#">← Vocabulario</a>
  <a class="nav-btn home" id="nav-home" href="#" aria-label="Inicio">🏠</a>
  <a class="nav-btn" id="nav-mapa" href="#" title="Mapa del Curso">🧭</a>
</nav>

<div class="wrap wrap-fin">
  <span class="badge">¡Vocabulario Completado!</span>

  <div class="fin-card">
    <!-- Emoji y título en la misma línea -->
    <h1 class="fin-title"><span class="fin-emoji">🎉</span> ¡Excelente trabajo!</h1>
    
    <p class="fin-desc">
      Has recorrido todas las palabras de esta lección. Puedes afianzar tu lectura con un reto rápido o continuar al juego.
    </p>

    <div class="fin-actions">
      <!-- Botón principal para continuar al Juego -->
      <a class="btn-main" id="btn-siguiente-juego" href="#">
        ⏭️ Continuar al Juego →
      </a>

      <!-- Botón para el motor Reto Flash (modo palabras) -->
      <a class="btn-sec btn-repaso" id="btn-repaso-flash" href="#">
        ⚡ Repasar en Reto Flash
      </a>

      <!-- Botón secundario por si quiere volver a ver las fichas -->
      <a class="btn-sec" id="btn-reiniciar-vocab" href="#">
        🔄 Ver palabras desde el inicio
      </a>
    </div>
  </div>

</div>

<script src="leccion_palabra_fin.js"></script>
<script src="ultima_posicion.js"></script>
</body>
</html>
