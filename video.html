<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Video · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+Gujarati:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-video.css">
<link rel="stylesheet" href="tema-video_desktop.css" media="(min-width: 1024px)">
</head>
<body>

<div class="wrap">
  <span class="badge" id="badge">Antes de empezar</span>
  <h1 id="titulo">Escucha esta conversación</h1>
  <p class="lead" id="intro"></p>

  <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>

  <div style="display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap; width:100%;">
    <div class="controls" style="width:auto; display:flex; gap:8px;">
      <button class="btn-play" id="btn-play" onclick="reproducir()">▶</button>
      <button class="btn-replay" id="btn-pause" onclick="togglePausa()" style="display:none;">⏸</button>
    </div>

    <div class="lang-row">
      <button class="lang-btn active" id="lang-esp" onclick="toggleIdioma('esp')">E</button>
      <button class="lang-btn active" id="lang-guj" onclick="toggleIdioma('guj')">ગ</button>
      <button class="lang-btn active" id="toggle-burbujas" onclick="toggleBurbujasTexto()" title="Mostrar/ocultar las burbujas de diálogo">💬</button>
    </div>
  </div>

  <div class="escena" id="escena"></div>

  <div class="subtitulos" id="subtitulos">
    <span class="sub-avatar" id="sub-avatar"></span>
    <span class="sub-textos" id="sub-textos">
      <span class="es-texto" id="sub-es"></span>
    </span>
    <span class="sub-mensaje-escucha" id="sub-mensaje-escucha">🎧 Escucha atentamente el diálogo</span>
  </div>

  <div class="nav-bottom-row">
    <button class="nav-btn" id="btn-volver">&larr; Lecci&oacute;n</button>
    <button class="lang-btn" id="toggle-avatar-icono" onclick="toggleAvatarIcono()" title="Mostrar/ocultar ícono de avatar">👤</button>
    <button class="lang-btn" id="toggle-marcador" onclick="toggleMarcadorActivo()" title="Mostrar/ocultar marcador de quien habla">🎯</button>
    <a class="btn-fin" id="btn-empezar" href="#">Empezar →</a>
  </div>

</div>

<audio id="audio"></audio>

<script src="video.js"></script>

</body>
</html>
