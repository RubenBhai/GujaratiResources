<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Practica la conversación · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+Gujarati:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-video-interactivo.css">
<link rel="stylesheet" href="tema-video-interactivo_desktop.css" media="(min-width: 1024px)">
</head>
<body>

<nav class="nav-bar">
  <span class="nav-btn nav-phantom">&nbsp;</span>
  <a class="nav-btn home" id="nav-home" href="index.html">🏠</a>
  <span class="nav-btn nav-phantom">&nbsp;</span>
</nav>

<div class="wrap">

  <!-- PANTALLA 1: Selección de avatar -->
  <div class="screen active" id="s-elegir">
    <span class="badge" id="badge">Tu turno de hablar</span>
    <h1 id="titulo">Practica la conversación</h1>
    <p class="lead" id="intro"></p>
    <p class="lead lead-destaque">¿Qué personaje quieres ser?</p>
    <div class="avatares-grid" id="avatares-grid"></div>
  </div>

  <!-- PANTALLA 2: Conversación -->
  <div class="screen" id="s-conversar">
    <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="lang-row">
      <button class="lang-btn active" id="lang-esp"          onclick="toggleIdioma('esp')">E</button>
      <button class="lang-btn active" id="lang-guj"          onclick="toggleIdioma('guj')">ગ</button>
      <button class="lang-btn active" id="toggle-burbujas"   onclick="toggleBurbujasTexto()" title="Mostrar/ocultar las burbujas de diálogo">💬</button>
      <button class="lang-btn"        id="toggle-avatar-icono" onclick="toggleAvatarIcono()"   title="Mostrar/ocultar ícono de avatar">👤</button>
      <button class="lang-btn"        id="toggle-marcador"   onclick="toggleMarcadorActivo()"  title="Mostrar/ocultar marcador de quien habla">🎯</button>
    </div>

    <div class="escena-wrap">
      <div class="bg-escena"           id="bg-escena"></div>
      <div class="bg-escena bg-capa-b" id="bg-escena-b"></div>
      <div class="sprites-escena"      id="sprites-escena"></div>
      <div class="resaltado-avatar"    id="resaltado-avatar"></div>
      <div class="escena"              id="escena"></div>
    </div>

    <div class="subtitulos" id="subtitulos">
      <span class="sub-avatar" id="sub-avatar"></span>
      <span class="sub-textos" id="sub-textos">
        <span class="es-texto" id="sub-es"></span>
      </span>
      <span class="sub-mensaje-escucha" id="sub-mensaje-escucha">🎧 Escucha atentamente el diálogo</span>
    </div>

    <!-- Turno del estudiante -->
    <div class="turno-box" id="turno-box">
      <div class="turno-titulo">🎙 ¡Es tu turno! Di esta frase:</div>
      <div class="guia-box" id="guia-box">
        <div class="guia-gu gu" id="guia-gu"></div>
        <div class="guia-es"    id="guia-es"></div>
      </div>
      <div class="fila-ayuda">
        <button class="btn-guia" id="btn-guia-es" onclick="toggleGuiaES()">Ayuda ESP</button>
        <button class="btn-guia" id="btn-guia-gu" onclick="toggleGuiaGUJ()">Ayuda GUJ</button>
      </div>
      <button class="btn-grabar" id="btn-grabar" onclick="toggleGrabacion()">🎙 Grabar mi voz</button>
      <div class="estado-turno" id="estado-turno"></div>
    </div>

    <button class="btn-play" id="btn-iniciar" onclick="iniciarConversacion()">▶ Comenzar</button>
  </div>

  <!-- PANTALLA 3: Resultado -->
  <div class="screen" id="s-resultado">
    <div class="resultado-card">
      <div class="resultado-emoji" id="res-emoji"></div>
      <div class="resultado-msg"   id="res-msg"></div>
      <div class="resultado-pct"   id="res-pct"></div>
      <div class="resultado-sub"   id="res-sub"></div>
    </div>
    <button class="btn-play btn-play-oro"    id="btn-replay-dialogo" onclick="reproducirDialogo()">▶ Ver el diálogo completo</button>
    <button class="btn-play btn-play-neutro" onclick="reiniciarTodo()">🔄 Practicar de nuevo</button>
    <button class="btn-fin"                  onclick="volverAFin()">✓ Volver a la lección</button>
  </div>

</div>

<audio id="audio"></audio>
<audio id="sfx"></audio>

<script src="video_interactivo.js"></script>

</body>
</html>
