<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Practica tu pronunciación · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+Gujarati:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-practica.css">
<link rel="stylesheet" href="tema-practica_desktop.css" media="(min-width: 1024px)">

</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <span class="badge">Práctica con Gemini IA</span>
    <a id="nav-guia" href="#" title="Mapa del Curso">🧭</a>
    <a class="btn-footer" href="#" onclick="history.back(); return false;">De regreso a la clase</a>
  </div>
  <header>
    <h1 id="page-title">Cargando…</h1>
    <p class="subtitle-row">
      <span id="page-subtitle"></span>
      <span class="separador">·</span>
      <span class="progreso-indicador" id="progreso-indicador"></span>
    </p>
    <div class="speed-bar">
      <span class="speed-label">Velocidad</span>
      <button class="btn-speed" onclick="setSpeed(0.75)">🐢 0.75x</button>
      <button class="btn-speed active" id="speed-1" onclick="setSpeed(1.0)">▶ 1x</button>
      <button class="btn-speed" onclick="setSpeed(1.25)">⚡ 1.25x</button>
    </div>
  </header>

  <section class="audio-theater" id="theater"></section>
</div>

<audio id="master-player" playsinline></audio>
<audio id="self-player"   playsinline></audio>

<script src="practica.js"></script>

</body>
</html>
