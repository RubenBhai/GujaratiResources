<title id="page-title">Componer · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&family=Noto+Serif+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">

<main class="escena">

  <div class="eyebrow"><span class="punto"></span><span id="cat">Frases</span> · Componer</div>

  <div class="pista">
    <p class="pista-label">Arma esta frase</p>
    <p class="pista-es" id="pista-es">—</p>
    <button class="btn-audio btn-audio-chico" id="btn-oir"><span class="ico">▶</span> Oír la frase</button>
  </div>

  <div class="construccion vacia" id="construccion"></div>
  <div class="banco" id="banco"></div>

  <div class="acciones-chips">
    <button class="btn-chip-sec" id="btn-limpiar">Limpiar</button>
    <button class="btn-chip-main" id="btn-comprobar">Comprobar</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="marcador">Aciertos: <span id="score">0</span></div>

</main>
