<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Preparando la lección · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Noto+Serif+Gujarati:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-leccion_loader.css">
</head>
<body>

<div class="loader-card">

  <!-- Cabecera: SIEMPRE visible (logo + lección) -->
  <div class="loader-cabecera">
    <img class="loader-logo"
         src="imagenes/LearnGujarati_SuperInmersivo_Main.jpg"
         alt="Piensa en Gujarati">
    <div class="loader-leccion" id="loader-leccion">Lección 1.1.1</div>
  </div>

  <!-- ZONA CENTRAL A: elección (botones). Visible al llegar si falta descargar. -->
  <div class="zona-eleccion" id="zona-eleccion">
    <div class="elec-titulo">¿Cómo quieres esta lección?</div>
    <div class="elec-tamano-linea">Ocupa <b id="elec-tamano">— MB</b> en tu dispositivo</div>
    <div class="elec-aviso" id="elec-aviso"></div>

    <button type="button" class="elec-btn elec-descargar" onclick="elecDescargar()">
      <span class="elec-ico">📥</span>
      <span>Descargar para usar sin internet
        <span class="elec-sub">Se guarda en tu teléfono, funciona sin datos</span>
      </span>
    </button>

    <button type="button" class="elec-btn elec-online" onclick="elecSoloEnLinea()">
      <span class="elec-ico">🌐</span>
      <span>Solo en línea
        <span class="elec-sub">No ocupa espacio, necesita internet</span>
      </span>
    </button>

    <button type="button" class="elec-btn elec-liberar" onclick="elecLiberarEspacio()">
      🗑️ Liberar el espacio de esta lección
    </button>
  </div>

  <!-- ZONA CENTRAL B: progreso (barra). Visible al descargar. -->
  <div class="zona-progreso" id="zona-progreso">
    <div class="loader-estado" id="loader-estado">Preparando...</div>
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-info">
        <span class="loader-recurso" id="loader-recurso"></span>
        <span id="progress-pct">0%</span>
      </div>
    </div>
  </div>

</div>

<script src="leccion_loader.js"></script>

</body>
</html>
