<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title id="page-title">Vocabulario · Piensa en Gujarati</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Serif+Gujarati:wght@400;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema-leccion_palabra.css">
<link rel="stylesheet" href="tema-leccion_palabra_desktop.css" media="(min-width: 1024px)">
<link rel="stylesheet" href="guia_navegacion_common.css">
</head>
<body>

<nav class="nav-bar">
  <a class="nav-btn" id="nav-anterior" href="#">← Anterior</a>
  <a class="nav-btn home" id="nav-home" href="#">🏠</a>
  <a class="nav-btn" id="nav-mapa" href="#" title="Mapa del Curso">🧭</a>
  <a class="nav-btn" id="nav-backwards" href="#" title="Repetir por partes" style="display:none;">🎤</a>
  <a class="nav-btn" id="nav-practicar" href="#">Practicar →</a>
</nav>

<div class="wrap">
  <span class="badge" id="badge"></span>

  <div class="frame-vocab-img">
    <img id="img-palabra" alt="" onerror="this.style.display='none'">
    <button type="button" class="btn-ampliar" id="btn-ampliar" aria-label="Ver en pantalla completa" title="Ver en pantalla completa">⛶</button>
  </div>

  <div class="frame-vocab-audio">
    <div class="frame-vocab-audio-top">
      <div class="frame-vocab-pron" id="pronunciacion">💡</div>
      <button class="btn-play" id="btn-play">▶</button>
      <a class="btn-dictado" id="btn-dictado" href="#" title="Dictado de esta palabra" style="display:none;">✍️</a>
    </div>
    <div class="frame-vocab-audio-bottom">
      <button class="btn-speed active" id="btn-normal" onclick="setSpeed(1.0)">▶ Normal</button>
      <button class="btn-speed"        id="btn-slow"   onclick="setSpeed(0.75)">🐢 Lento</button>
    </div>
  </div>

  <div class="botones-inferiores">
    <a class="btn-sec" id="btn-practicar-pronunciacion" href="#" style="display:none;">🎙 A practicar la pronunciación</a>
    <div class="btn-row">
      <a class="btn-sec btn-flex" id="btn-sigleccion" href="#">⏭️ Siguiente lección</a>
      <a class="btn-main btn-flex" id="btn-siguiente" href="#">Siguiente →</a>
    </div>
  </div>
</div>

<audio id="player"></audio>

<script src="leccion_palabra.js"></script>

  <!-- Modo pantalla completa 16:9 -->
  <div class="wide-overlay" id="wide-overlay" aria-hidden="true">
    <img id="wide-img" alt="">
    <button type="button" class="wide-cerrar" id="wide-cerrar" aria-label="Salir de pantalla completa" title="Salir">✕</button>
  </div>

</body>
</html>
